<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUST - Students Clearance System | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="auth-card">
    <h2>MUST Clearance</h2>
    <p>Automated Student Clearance System</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="role">Ingia kama (Role):</label>
        <select id="role" required>
          <option value="student">Mwanafunzi (Student)</option>
          <option value="staff">Stafu wa Idara (Staff)</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
      <div class="form-group">
        <label for="username">Reg No / Staff ID / Username:</label>
        <input type="text" id="username" placeholder="Mfano: 211005332001" required>
      </div>
      <div class="form-group">
        <label for="password">Neno la Siri (Password):</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Ingia Mfomoni</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
